
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="55%" stop-color="#1f3b73"/>
      <stop offset="100%" stop-color="#ff7900"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="waveClip">
      <path d="M0,0 H1200 V205 C1000,255 800,165 600,205 C400,245 200,175 0,215 Z">
        <animate attributeName="d" dur="7s" repeatCount="indefinite"
          values="M0,0 H1200 V205 C1000,255 800,165 600,205 C400,245 200,175 0,215 Z;
                  M0,0 H1200 V220 C1000,175 800,250 600,210 C400,170 200,245 0,200 Z;
                  M0,0 H1200 V205 C1000,255 800,165 600,205 C400,245 200,175 0,215 Z"/>
      </path>
    </clipPath>
    <style>
      .name  { font: 800 66px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 1px;
               opacity: 0; animation: rise 1.2s ease-out 0.2s forwards; }
      .sub   { font: 600 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffe3c7; letter-spacing: 0.5px;
               opacity: 0; animation: rise 1.2s ease-out 0.9s forwards; }
      .tag   { font: 600 15px 'Fira Code', Consolas, 'Courier New', monospace; fill: #ffffff; opacity: 0;
               animation: fade 1s ease-out 1.6s forwards; }
      .node  { fill: #ffffff; animation: pulse 2.6s ease-in-out infinite; }
      .link  { stroke: #ffffff; stroke-width: 1.2; opacity: 0.18; }
      .spark { fill: #ffb366; animation: float 6s ease-in-out infinite; }
      .shine { animation: sweep 6s linear infinite; }
      @keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade  { from { opacity: 0; } to { opacity: 0.85; } }
      @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }
      @keyframes float { 0%,100% { transform: translateY(0); opacity: 0.2; } 50% { transform: translateY(-14px); opacity: 0.8; } }
      @keyframes sweep { from { transform: translateX(-1200px); } to { transform: translateX(1200px); } }
    </style>
  </defs>

  <g clip-path="url(#waveClip)">
    <rect width="1200" height="270" fill="url(#bg)"/>

    <!-- neural network, left -->
    <g>
      <line class="link" x1="35"  y1="60"  x2="110" y2="110"/>
      <line class="link" x1="35"  y1="160" x2="110" y2="110"/>
      <line class="link" x1="110" y1="110" x2="185" y2="35"/>
      <line class="link" x1="110" y1="110" x2="185" y2="160"/>
      <line class="link" x1="35"  y1="60"  x2="185" y2="35"/>
      <circle class="node" cx="35"  cy="60"  r="5"/>
      <circle class="node" cx="35"  cy="160" r="5" style="animation-delay:.6s"/>
      <circle class="node" cx="110" cy="110" r="7" style="animation-delay:1.2s"/>
      <circle class="node" cx="185" cy="35"  r="5" style="animation-delay:.3s"/>
      <circle class="node" cx="185" cy="160" r="5" style="animation-delay:1.8s"/>
    </g>

    <!-- neural network, right -->
    <g>
      <line class="link" x1="1025"  y1="70"  x2="1100" y2="120"/>
      <line class="link" x1="1025"  y1="170" x2="1100" y2="120"/>
      <line class="link" x1="1100" y1="120" x2="1170" y2="60"/>
      <line class="link" x1="1100" y1="120" x2="1170" y2="165"/>
      <line class="link" x1="1170" y1="60"  x2="1170" y2="165"/>
      <circle class="node" cx="1025"  cy="70"  r="5" style="animation-delay:.9s"/>
      <circle class="node" cx="1025"  cy="170" r="5" style="animation-delay:.2s"/>
      <circle class="node" cx="1100" cy="120" r="7" style="animation-delay:1.5s"/>
      <circle class="node" cx="1170" cy="60"  r="5" style="animation-delay:.5s"/>
      <circle class="node" cx="1170" cy="165" r="5" style="animation-delay:2.1s"/>
    </g>

    <!-- floating sparks -->
    <circle class="spark" cx="330" cy="200" r="3"/>
    <circle class="spark" cx="420" cy="40"  r="2.5" style="animation-delay:1s"/>
    <circle class="spark" cx="800" cy="45"  r="3"   style="animation-delay:2s"/>
    <circle class="spark" cx="880" cy="190" r="2.5" style="animation-delay:3s"/>
    <circle class="spark" cx="600" cy="30"  r="2"   style="animation-delay:4s"/>

    <!-- light sweep -->
    <rect class="shine" x="0" y="0" width="500" height="270" fill="url(#shine)"/>

    <text class="name" x="600" y="118" text-anchor="middle">Jeremiah Koske</text>
    <text class="sub"  x="600" y="160" text-anchor="middle">AI &amp; Full-Stack Software Engineer  ·  LLM Agents  ·  Web &amp; Mobile  ·  FinTech</text>
    <text class="tag"  x="600" y="192" text-anchor="middle">&lt; Nairobi, Kenya /&gt;</text>
  </g>

  <!-- soft second wave -->
  <path fill="#ff7900" opacity="0.35" d="M0,222 C200,182 400,252 600,212 C800,172 1000,262 1200,212 V214 C1000,264 800,174 600,214 C400,254 200,184 0,224 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,222 C200,182 400,252 600,212 C800,172 1000,262 1200,212 V214 C1000,264 800,174 600,214 C400,254 200,184 0,224 Z;
              M0,207 C200,252 400,177 600,217 C800,257 1000,182 1200,227 V229 C1000,184 800,259 600,219 C400,179 200,254 0,209 Z;
              M0,222 C200,182 400,252 600,212 C800,172 1000,262 1200,212 V214 C1000,264 800,174 600,214 C400,254 200,184 0,224 Z"/>
  </path>
</svg>
