<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#0b1424"/>
      <stop offset="50%" stop-color="#1f3b73"/>
      <stop offset="100%" stop-color="#ff7900"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="waveClip">
      <path d="M0,0 H1200 V225 C1000,275 800,185 600,225 C400,265 200,195 0,235 Z">
        <animate attributeName="d" dur="7s" repeatCount="indefinite"
          values="M0,0 H1200 V225 C1000,275 800,185 600,225 C400,265 200,195 0,235 Z;
                  M0,0 H1200 V240 C1000,195 800,270 600,230 C400,190 200,265 0,220 Z;
                  M0,0 H1200 V225 C1000,275 800,185 600,225 C400,265 200,195 0,235 Z"/>
      </path>
    </clipPath>
    <style>
      .sans  { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .name  { font-size: 66px; font-weight: 800; fill: #ffffff; letter-spacing: 1px;
               opacity: 0; animation: rise 1.2s ease-out .2s forwards; }
      .sub   { font-size: 21px; font-weight: 600; fill: #ffe3c7; letter-spacing: .5px;
               opacity: 0; animation: rise 1.2s ease-out .8s forwards; }
      .term  { opacity: 0; animation: fade 1s ease-out 1.5s forwards; }
      .cmd   { font-size: 15px; fill: #e6edf3; }
      .ps    { font-size: 15px; fill: #ffb366; font-weight: 700; }
      .flag  { font-size: 15px; fill: #7ee787; }
      .cur   { fill: #ffb366; animation: blink 1s steps(1) infinite; }
      .code  { font-size: 12px; fill: #ffffff; opacity: .16; }
      .node  { fill: #ffffff; animation: pulse 2.6s ease-in-out infinite; }
      .link  { stroke: #ffffff; stroke-width: 1.2; opacity: .18; }
      .pkt   { fill: #ffb366; }
      .spark { fill: #ffb366; animation: float 6s ease-in-out infinite; }
      .shine { animation: sweep 6s linear infinite; }
      @keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade  { to { opacity: 1; } }
      @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
      @keyframes float { 0%,100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(-14px); opacity: .8; } }
      @keyframes sweep { from { transform: translateX(-1200px); } to { transform: translateX(1200px); } }
    </style>
  </defs>

  <g clip-path="url(#waveClip)">
    <rect width="1200" height="290" fill="url(#bg)"/>
    <rect width="1200" height="290" fill="url(#grid)"/>

    <!-- faint code in the corners -->
    <g class="mono code">
      <text x="24" y="196">await build({ web, android, ios })</text>
      <text x="24" y="212">deploy("production") // ✓ live</text>
      <text x="1176" y="28" text-anchor="end">GET /api/v1/systems  200 OK  42ms</text>
      <text x="1176" y="46" text-anchor="end">flutter build appbundle --release ✓</text>
    </g>

    <!-- network, left (with travelling data packets) -->
    <g>
      <line class="link" x1="35"  y1="60"  x2="110" y2="110"/>
      <line class="link" x1="35"  y1="160" x2="110" y2="110"/>
      <line class="link" x1="110" y1="110" x2="185" y2="70"/>
      <line class="link" x1="110" y1="110" x2="185" y2="160"/>
      <line class="link" x1="35"  y1="60"  x2="185" y2="70"/>
      <circle class="node" cx="35"  cy="60"  r="5"/>
      <circle class="node" cx="35"  cy="160" r="5" style="animation-delay:.6s"/>
      <circle class="node" cx="110" cy="110" r="7" style="animation-delay:1.2s"/>
      <circle class="node" cx="185" cy="70"  r="5" style="animation-delay:.3s"/>
      <circle class="node" cx="185" cy="160" r="5" style="animation-delay:1.8s"/>
      <circle class="pkt" r="3"><animateMotion dur="2.4s" repeatCount="indefinite" path="M35,60 L110,110 L185,160"/></circle>
      <circle class="pkt" r="3"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M35,160 L110,110 L185,70"/></circle>
    </g>

    <!-- network, right -->
    <g>
      <line class="link" x1="1025" y1="80"  x2="1100" y2="130"/>
      <line class="link" x1="1025" y1="180" x2="1100" y2="130"/>
      <line class="link" x1="1100" y1="130" x2="1170" y2="80"/>
      <line class="link" x1="1100" y1="130" x2="1170" y2="180"/>
      <line class="link" x1="1170" y1="80"  x2="1170" y2="180"/>
      <circle class="node" cx="1025" cy="80"  r="5" style="animation-delay:.9s"/>
      <circle class="node" cx="1025" cy="180" r="5" style="animation-delay:.2s"/>
      <circle class="node" cx="1100" cy="130" r="7" style="animation-delay:1.5s"/>
      <circle class="node" cx="1170" cy="80"  r="5" style="animation-delay:.5s"/>
      <circle class="node" cx="1170" cy="180" r="5" style="animation-delay:2.1s"/>
      <circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M1025,80 L1100,130 L1170,180"/></circle>
      <circle class="pkt" r="3"><animateMotion dur="3.2s" begin="1.4s" repeatCount="indefinite" path="M1025,180 L1100,130 L1170,80"/></circle>
    </g>

    <!-- floating sparks -->
    <circle class="spark" cx="330" cy="215" r="3"/>
    <circle class="spark" cx="420" cy="40"  r="2.5" style="animation-delay:1s"/>
    <circle class="spark" cx="800" cy="70"  r="3"   style="animation-delay:2s"/>
    <circle class="spark" cx="880" cy="205" r="2.5" style="animation-delay:3s"/>

    <rect class="shine" x="0" y="0" width="500" height="290" fill="url(#shine)"/>

    <text class="sans name" x="600" y="112" text-anchor="middle">Jeremiah Koske</text>
    <text class="sans sub"  x="600" y="152" text-anchor="middle">Full-Stack Software Engineer  ·  Web Systems  ·  Android &amp; iOS Apps  ·  AI Integration</text>

    <!-- terminal line with blinking cursor -->
    <g class="term mono">
      <rect x="292" y="170" width="616" height="34" rx="8" fill="#0b1424" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="310" cy="187" r="4" fill="#ff5f56"/>
      <circle cx="324" cy="187" r="4" fill="#ffbd2e"/>
      <circle cx="338" cy="187" r="4" fill="#27c93f"/>
      <text x="356" y="192"><tspan class="ps">jeremiah@nairobi:~$</tspan><tspan class="cmd"> build </tspan><tspan class="flag">--web --android --ios --api</tspan></text>
      <rect class="cur" x="874" y="179" width="9" height="17"/>
    </g>
  </g>

  <!-- accent wave line -->
  <path fill="#ff7900" opacity="0.4" d="M0,242 C200,202 400,272 600,232 C800,192 1000,282 1200,232 V234 C1000,284 800,194 600,234 C400,274 200,204 0,244 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,242 C200,202 400,272 600,232 C800,192 1000,282 1200,232 V234 C1000,284 800,194 600,234 C400,274 200,204 0,244 Z;
              M0,227 C200,272 400,197 600,237 C800,277 1000,202 1200,247 V249 C1000,204 800,279 600,239 C400,199 200,274 0,229 Z;
              M0,242 C200,202 400,272 600,232 C800,192 1000,282 1200,232 V234 C1000,284 800,194 600,234 C400,274 200,204 0,244 Z"/>
  </path>
</svg>
